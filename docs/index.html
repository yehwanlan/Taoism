<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="format-detection" content="telephone=no">
    <title>道教經典翻譯系統 v2.0</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>

<body>
    <div id="password-overlay">
        <div class="password-box">
            <h2>請輸入密語</h2>
            <p>福生無量天尊</p>
            <input type="text" id="password-input" placeholder="福生無量天尊" autocomplete="off" autocorrect="off"
                autocapitalize="off" spellcheck="false">
            <button id="password-submit">進入</button>
            <p class="password-hint">按 Tab 自動帶入密語，或直接按 Enter／「進入」</p>
            <p id="password-error" class="error-message"></p>
        </div>
    </div>

    <div id="main-content">
        <header>
            <h1>🏛️ 道教經典翻譯系統 v2.0</h1>
            <div class="system-info">
                <span id="system-stats">載入中...</span>
                <div id="daily-fortune" class="daily-fortune">
                    <span id="fortune-info">🗓️ 載入今日拜拜資訊...</span>
                    <div style="font-size: 0.75em; margin-top: 0.3rem; opacity: 0.8;">
                        ※ 基於日干支計算，60天循環
                    </div>
                </div>
            </div>
        </header>

        <nav class="main-nav">
            <div class="nav-section">
                <h3>📚 選擇經典</h3>
                <select id="book-select">
                    <option value="">請選擇經典...</option>
                </select>
            </div>

            <div class="nav-section">
                <h3>📖 選擇章節</h3>
                <select id="chapter-select" disabled>
                    <option value="">請先選擇經典</option>
                </select>
            </div>

            <div class="nav-section legacy-section">
                <h3>📜 舊版經典</h3>
                <select id="legacy-select">
                    <option value="">選擇舊版經典...</option>
                </select>
            </div>

            <div class="nav-controls">
                <button id="prev-chapter" disabled>⬅️ 上一章</button>
                <button id="next-chapter" disabled>下一章 ➡️</button>
                <button id="toggle-view">🔄 切換顯示模式</button>
            </div>
        </nav>

        <main>
            <div class="content-header">
                <h2 id="current-title">道教經典翻譯系統</h2>
                <div class="content-info">
                    <span id="content-stats"></span>
                </div>
            </div>

            <div class="text-container" id="text-container">
                <div class="translated-text">
                    <h3>📝 現代中文翻譯</h3>
                    <div id="translated-content">
                        <div class="loading"></div> 載入中...
                    </div>
                </div>
                <div class="original-text">
                    <h3>📜 古文原文</h3>
                    <div id="original-content">
                        <div class="loading"></div> 載入中...
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <div class="footer-content">
                <p>&copy; 2025 道教經典翻譯系統 v2.0. All rights reserved.</p>
                <div class="footer-links">
                    <a href="https://github.com/yehwanlan/Taoism" target="_blank">📂 GitHub</a>
                    <a href="#" onclick="showSystemInfo()">ℹ️ 系統資訊</a>
                    <a href="#" onclick="showHelp()">❓ 使用說明</a>
                    <a href="calendar.html" target="_blank">📅 萬年曆</a>
                    <a href="deity-birthday.html" target="_blank">🏮 神明聖誕</a>
                    <a href="progress.html">📈 翻譯進度</a>
                    <a href="六十甲子完整表.md" target="_blank">📊 完整對照表</a>
                    <a href="天干地支計算說明.md" target="_blank">🗓️ 計算說明</a>
                </div>
            </div>
        </footer>
    </div>

    <!-- 載入 JavaScript 模組 -->
    <script src="js/lunar-calendar.js"></script>
    <script src="js/fortune.js"></script>
    <script src="js/deity-birthday.js"></script>
    <script src="js/script.js"></script>
    
    <!-- 初始化農曆和拜拜資訊 -->
    <script>
        // 確保 DOM 載入完成後初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeFortune);
        } else {
            initializeFortune();
        }
        
        function initializeFortune() {
            try {
                // 初始化農曆系統
                const lunarCalendar = new LunarCalendar();
                
                // 初始化拜拜好日子系統
                const fortuneChecker = new FortuneChecker();
                
                // 更新今日拜拜資訊
                updateTodayFortune(lunarCalendar, fortuneChecker);
            } catch (error) {
                console.error('初始化農曆功能失敗:', error);
                // 顯示錯誤訊息
                const fortuneInfo = document.getElementById('fortune-info');
                if (fortuneInfo) {
                    fortuneInfo.innerHTML = '⚠️ 農曆功能載入失敗';
                }
            }
        }
        
        // 近 7 日神明聖誕（依農曆計算），最多列三天
        function upcomingDeityLine() {
            if (typeof deityChecker === 'undefined') return '';
            const upcoming = deityChecker.getUpcomingBirthdays(7);
            if (upcoming.length === 0) return '';
            const items = upcoming.slice(0, 3).map(item => {
                const when = item.isToday ? '<strong>今日</strong>'
                    : item.isTomorrow ? '明日'
                    : `${item.date.getMonth() + 1}/${item.date.getDate()}`;
                const names = item.deities.slice(0, 2).map(d => d.name).join('、');
                const more = item.deities.length > 2 ? ` 等${item.deities.length}位` : '';
                return `${when} ${names}${more}`;
            });
            return `🏮 <a href="deity-birthday.html" target="_blank">近期聖誕</a>：${items.join('；')}<br>`;
        }

        function updateTodayFortune(lunarCalendar, fortuneChecker) {
            const fortuneInfo = document.getElementById('fortune-info');
            const dailyFortune = document.getElementById('daily-fortune');
            
            if (!fortuneInfo || !dailyFortune) return;
            
            try {
                const today = new Date();
                
                // 獲取農曆日期
                const lunar = lunarCalendar.solarToLunar(
                    today.getFullYear(),
                    today.getMonth() + 1,
                    today.getDate()
                );
                
                // 獲取日干支和拜拜資訊
                const todayFortune = fortuneChecker.getTodayFortune();
                
                // 格式化農曆日期
                const lunarDateStr = lunarCalendar.formatLunarDate(lunar);
                
                // 組合顯示內容
                let displayText = `${todayFortune.emoji} ${todayFortune.date} ${todayFortune.stemBranch}日<br>`;
                displayText += `🌙 農曆：${lunarDateStr}<br>`;
                displayText += upcomingDeityLine();
                displayText += `${fortuneChecker.getStatusText(todayFortune.status)}<br>`;
                displayText += `<small>${todayFortune.description}</small>`;
                
                // 更新內容
                fortuneInfo.innerHTML = displayText;
                
                // 更新樣式
                dailyFortune.className = `daily-fortune fortune-${todayFortune.status}`;
                
            } catch (error) {
                console.error('更新拜拜資訊失敗:', error);
                fortuneInfo.innerHTML = '⚠️ 無法載入今日資訊';
            }
        }
    </script>
</body>

</html>
